<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="卡" />
  <meta name="theme-color" content="#0b0b0d" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <title>卡</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --card: #16161a;
      --line: #2a2a30;
      --text: #f4f4f5;
      --muted: #8e8e96;
      --accent: #6ea8ff;
      --green: #3ee0a0;
      --red: #ff5d5d;
      --orange: #ffb020;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 98px;
    }
    .page { display: none; }
    .page.active { display: block; }
    .top {
      padding: 22px 20px 8px;
    }
    .top h1 { font-size: 28px; font-weight: 720; letter-spacing: -0.03em; }
    .top p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .advice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 16px 8px;
    }
    .tile {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      min-height: 128px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tile:active { transform: scale(0.98); }
    .tile-cat { font-size: 15px; font-weight: 650; }
    .tile-card { font-size: 18px; font-weight: 720; margin-top: 10px; }
    .tile-rate { font-size: 13px; color: var(--green); font-weight: 650; margin-top: 4px; }
    .tile.empty .tile-card, .tile.empty .tile-rate { color: var(--muted); font-weight: 500; font-size: 13px; }
    .nav {
      position: fixed; left: 16px; right: 16px; bottom: 18px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 20;
    }
    .nav button {
      border: 0; border-radius: 18px; padding: 16px 10px;
      font-size: 16px; font-weight: 700; color: white;
    }
    .nav-left { background: #3b82f6; }
    .nav-right { background: #22c55e; }
    .header {
      padding: 16px 16px 10px; display: flex; align-items: center; justify-content: space-between;
    }
    .back { background: none; border: 0; color: var(--accent); font-size: 16px; }
    .header h2 { font-size: 20px; font-weight: 720; }
    .month-selector {
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      padding: 6px 12px; border-radius: 20px; font-size: 13px;
    }
    .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 16px; }
    .card-item {
      background: var(--card); border: 1px solid var(--line); border-radius: 20px;
      padding: 16px; min-height: 108px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .card-nickname { font-size: 16px; font-weight: 700; }
    .card-network { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card-remaining { font-size: 13px; color: var(--green); font-weight: 650; }
    .card-remaining.low { color: var(--orange); }
    .card-remaining.zero { color: var(--red); }
    .block { margin: 8px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .empty { text-align: center; color: var(--muted); padding: 28px 12px; }
    .search { margin: 8px 16px; }
    .search input, .form-group input, .form-group select, .form-group textarea {
      width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 13px; color: var(--text); font-size: 16px;
    }
    .data-actions { display: flex; gap: 8px; margin: 8px 16px; }
    .data-btn { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 14px; padding: 12px; font-weight: 650; }
    .add-btn {
      margin: 12px 16px; width: calc(100% - 32px); background: transparent; border: 1px dashed var(--line);
      color: var(--accent); padding: 15px; border-radius: 16px; font-size: 15px; font-weight: 700;
    }
    .vault-card { display: flex; justify-content: space-between; align-items: center; }
    .deleted-tag { background: var(--red); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 8px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: flex-end; z-index: 40; }
    .modal-overlay.show { display: flex; }
    .modal { background: #1a1a1f; width: 100%; border-radius: 24px 24px 0 0; padding: 22px 18px 36px; max-height: 92vh; overflow: auto; }
    .modal h3 { text-align: center; font-size: 18px; margin-bottom: 8px; }
    .hint { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-size: 16px; font-weight: 700; }
    .btn-cancel { background: #2a2a30; color: var(--text); }
    .btn-ok { background: var(--accent); color: #081018; }
    .btn-danger { background: var(--red); color: #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); background: #23232a; color: var(--text); border-radius: 999px; padding: 8px 12px; font-size: 13px; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #081018; }
    .pick { width: 100%; text-align: left; background: #23232a; border: 1px solid var(--line); color: var(--text); border-radius: 14px; padding: 14px; margin-bottom: 8px; }
    .pick.on { border-color: var(--accent); }
    .order-row { display: flex; gap: 8px; margin-top: 8px; }
    .toast { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); background: var(--green); color: #062; padding: 9px 16px; border-radius: 999px; font-weight: 700; display: none; z-index: 80; }
    .toast.show { display: block; }
    .hidden { display: none; }
    .warn { background: rgba(255,93,93,.12); border: 1px solid var(--red); color: #ff8d8d; border-radius: 14px; padding: 12px; font-size: 13px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div id="toast" class="toast">已儲存</div>

  <div id="advicePage" class="page active">
    <div class="top">
      <h1>簽帳建議</h1>
      <p>撳格仔改用邊張卡同順序</p>
    </div>
    <div class="advice-grid" id="adviceGrid"></div>
  </div>

  <div id="vaultPage" class="page">
    <div class="header">
      <button class="back" onclick="showPage('advice')">‹ 建議</button>
      <h2>金庫</h2>
      <span></span>
    </div>
    <div class="search"><input id="searchInput" placeholder="搜尋暱稱 / 最後4位 / 銀行" oninput="renderVault()" /></div>
    <div class="data-actions">
      <button class="data-btn" onclick="exportAll()">匯出.json</button>
      <button class="data-btn" onclick="document.getElementById('importFile').click()">匯入.json</button>
    </div>
    <input id="importFile" class="hidden" type="file" accept=".json,application/json" onchange="importData(event)" />
    <div id="vaultList"></div>
    <button class="add-btn" onclick="openAddCard()">＋ 新增信用卡</button>
    <button class="add-btn" style="color:var(--muted);border-style:solid;" onclick="toggleDeletedView()"><span id="deletedBtnText">查看已刪除卡片</span></button>
  </div>

  <div id="rebatePage" class="page">
    <div class="header">
      <button class="back" onclick="showPage('advice')">‹ 建議</button>
      <h2>回贈</h2>
      <select id="monthSelect" class="month-selector" onchange="changeMonth()"></select>
    </div>
    <div class="cards-grid" id="cardsGrid"></div>
    <div class="block" id="recentRecords"></div>
    <div class="block" id="summaryCard"></div>
  </div>

  <div id="detailPage" class="page">
    <div class="header">
      <button class="back" onclick="showPage('vault')">‹ 金庫</button>
      <h2 id="detailTitle">卡片</h2>
      <span></span>
    </div>
    <div class="block" id="detailContent"></div>
  </div>

  <nav class="nav" id="bottomNav">
    <button class="nav-left" onclick="showPage('vault')">金庫</button>
    <button class="nav-right" onclick="showPage('rebate')">回贈</button>
  </nav>

  <div class="modal-overlay" id="slotModal">
    <div class="modal">
      <h3 id="slotTitle">改建議</h3>
      <div class="hint">揀一張金庫入面嘅卡，會顯示回贈 %</div>
      <div id="slotCardList"></div>
      <div class="order-row">
        <button class="btn btn-cancel" onclick="moveSlot(-1)">上移</button>
        <button class="btn btn-cancel" onclick="moveSlot(1)">下移</button>
      </div>
      <div class="actions">
        <button class="btn btn-cancel" onclick="closeSlot()">完成</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="amountModal">
    <div class="modal">
      <h3 id="amountModalTitle">新增簽帳</h3>
      <div class="form-group"><label>月份</label><select id="amountMonth"></select></div>
      <div class="form-group"><label>金額（港元）</label><input id="amountInput" type="number" inputmode="decimal" placeholder="輸入金額" /></div>
      <div class="actions">
        <button class="btn btn-cancel" onclick="closeAmountModal()">取消</button>
        <button class="btn btn-ok" onclick="saveAmount()">確認</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="addCardModal">
    <div class="modal">
      <h3>新增信用卡</h3>
      <div class="hint" id="addStepHint">第 1／3 步：金庫資料</div>
      <div id="step1">
        <div class="warn">完整卡號同 CVC 屬敏感資料，可只填最後 4 位。</div>
        <div class="form-group"><label>暱稱（必填）</label><input id="newNickname" placeholder="例如：滙豐綠卡" /></div>
        <div class="form-group"><label>銀行</label><input id="newBank" placeholder="例如：滙豐" /></div>
        <div class="form-group"><label>卡種網絡</label>
          <select id="newNetwork">
            <option>Visa</option><option>Mastercard</option><option>銀聯</option><option>American Express</option><option>其他</option>
          </select>
        </div>
        <div class="form-group"><label>最後 4 位</label><input id="newLast4" maxlength="4" inputmode="numeric" /></div>
        <div class="form-group"><label>完整卡號</label><input id="newFullNumber" inputmode="numeric" placeholder="可留空" /></div>
        <div class="form-group"><label>到期日 MM/YY</label><input id="newExpiry" maxlength="5" placeholder="08/28" /></div>
        <div class="form-group"><label>驗證碼 CVC</label><input id="newCvc" maxlength="4" inputmode="numeric" placeholder="可留空" /></div>
      </div>
      <div id="step2" class="hidden">
        <div class="form-group"><label>每月回贈上限</label><input id="newCap" type="number" inputmode="decimal" placeholder="5000" /></div>
        <div class="form-group"><label>回贈比率 %</label><input id="newRate" type="number" step="0.1" inputmode="decimal" placeholder="1.5" /></div>
      </div>
      <div id="step3" class="hidden">
        <div class="form-group"><label>呢張卡預設用喺邊啲格仔</label><div class="chips" id="catChips"></div></div>
      </div>
      <div class="actions">
        <button class="btn btn-cancel" id="addPrevBtn" onclick="addStep(-1)">取消</button>
        <button class="btn btn-ok" id="addNextBtn" onclick="addStep(1)">下一步</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <h3>刪除並設定迎新冷卻</h3>
      <div class="form-group"><label>刪除日期</label><input id="deleteDate" type="date" /></div>
      <div class="form-group"><label>冷卻期</label>
        <select id="cooldownMonths">
          <option value="6">6 個月</option><option value="9">9 個月</option>
          <option value="12" selected>12 個月</option><option value="18">18 個月</option><option value="24">24 個月</option>
        </select>
      </div>
      <div class="form-group"><label>最早可再申請迎新</label><input id="nextEligibleDate" readonly /></div>
      <div class="actions">
        <button class="btn btn-cancel" onclick="closeDeleteModal()">取消</button>
        <button class="btn btn-danger" onclick="confirmDelete()">確認刪除</button>
      </div>
    </div>
  </div>

<script>
const KEYS = { vault: "cardApp_vault", rebate: "cardApp_rebate", advice: "cardApp_advice" };
const DEFAULT_SLOTS = ["餐飲","港幣網購","外幣網購","外幣實體","手機支付","超市","交通","繳費"];

let vault = { type: "vault", cards: [] };
let rebate = { type: "rebate", settings: {}, transactions: [], currentMonth: "" };
let advice = { type: "advice", slots: [] };
let currentCardId = null;
let currentSlotId = null;
let showDeleted = false;
let addCurrentStep = 1;
let selectedCats = [];

function loadJSON(key, fb) {
  try { const raw = localStorage.getItem(key); return raw ? Object.assign(fb, JSON.parse(raw)) : fb; }
  catch(e) { return fb; }
}
function saveAll() {
  localStorage.setItem(KEYS.vault, JSON.stringify(vault));
  localStorage.setItem(KEYS.rebate, JSON.stringify(rebate));
  localStorage.setItem(KEYS.advice, JSON.stringify(advice));
}
function activeCards() { return vault.cards.filter(c => !c.deleted); }
function cardById(id) { return vault.cards.find(c => c.id === id); }
function slotById(id) { return advice.slots.find(s => s.id === id); }
function ensureSlots() {
  if (!Array.isArray(advice.slots) || !advice.slots.length) {
    advice.slots = DEFAULT_SLOTS.map((name, i) => ({ id: "s" + i, name, cardId: "", order: i }));
  }
  advice.slots.sort((a,b) => a.order - b.order);
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}
function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function migrateOld() {
  const old = localStorage.getItem("rebateAppData");
  if (old && !vault.cards.length) {
    try {
      const d = JSON.parse(old);
      (d.cards || []).forEach(c => {
        vault.cards.push({
          id: c.id, nickname: c.nickname, bank: c.bank, network: c.network, last4: c.last4,
          fullNumber: c.fullNumber || "", expiry: c.expiry || "", cvc: c.cvc || "",
          deleted: !!c.deleted, deletedDate: c.deletedDate || "", cooldownMonths: c.cooldownMonths || 12,
          nextEligibleDate: c.nextEligibleDate || "", createdAt: c.createdAt || Date.now()
        });
        rebate.settings[c.id] = { cap: c.cap || 0, rate: c.rate || 0 };
      });
      rebate.transactions = d.transactions || [];
    } catch(e) {}
  }
  if (advice.byCard && !advice.slots) advice.slots = [];
  ensureSlots();
}

function init() {
  vault = loadJSON(KEYS.vault, vault);
  rebate = loadJSON(KEYS.rebate, rebate);
  advice = loadJSON(KEYS.advice, advice);
  if (!Array.isArray(vault.cards)) vault.cards = [];
  if (!rebate.settings) rebate.settings = {};
  if (!Array.isArray(rebate.transactions)) rebate.transactions = [];
  migrateOld();
  const now = new Date();
  rebate.currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  populateMonths();
  showPage("advice");
}

function showPage(name) {
  ["advicePage","vaultPage","rebatePage","detailPage"].forEach(id => document.getElementById(id).classList.remove("active"));
  document.getElementById(name + "Page").classList.add("active");
  document.getElementById("bottomNav").style.display = name === "advice" ? "grid" : "none";
  if (name === "advice") renderAdvice();
  if (name === "vault") renderVault();
  if (name === "rebate") renderRebate();
  window.scrollTo(0,0);
}

function rateOf(cardId) { return Number((rebate.settings[cardId] || {}).rate || 0); }

function renderAdvice() {
  ensureSlots();
  document.getElementById("adviceGrid").innerHTML = advice.slots.map(slot => {
    const card = slot.cardId ? cardById(slot.cardId) : null;
    const live = card && !card.deleted;
    const rate = live ? rateOf(card.id) : 0;
    return `<button class="tile ${live ? "" : "empty"}" onclick="openSlot('${slot.id}')">
      <div class="tile-cat">${escapeHtml(slot.name)}</div>
      <div>
        <div class="tile-card">${live ? escapeHtml(card.nickname) : "未選卡"}</div>
        <div class="tile-rate">${live ? rate + "% 回贈" : "撳入去設定"}</div>
      </div>
    </button>`;
  }).join("");
}

function openSlot(id) {
  currentSlotId = id;
  const slot = slotById(id);
  document.getElementById("slotTitle").textContent = slot.name;
  const cards = activeCards();
  document.getElementById("slotCardList").innerHTML = cards.length ? cards.map(c => {
    const on = slot.cardId === c.id ? "on" : "";
    return `<button class="pick ${on}" onclick="chooseSlotCard('${c.id}')">${escapeHtml(c.nickname)} · ${rateOf(c.id)}%</button>`;
  }).join("") : `<div class="empty">金庫未有卡，請先去金庫新增</div>`;
  document.getElementById("slotModal").classList.add("show");
}
function chooseSlotCard(cardId) {
  const slot = slotById(currentSlotId);
  slot.cardId = cardId;
  saveAll();
  openSlot(currentSlotId);
  renderAdvice();
}
function moveSlot(dir) {
  ensureSlots();
  const i = advice.slots.findIndex(s => s.id === currentSlotId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= advice.slots.length) return;
  const tmp = advice.slots[i];
  advice.slots[i] = advice.slots[j];
  advice.slots[j] = tmp;
  advice.slots.forEach((s, idx) => s.order = idx);
  saveAll();
  renderAdvice();
  toast(dir < 0 ? "已上移" : "已下移");
}
function closeSlot() { document.getElementById("slotModal").classList.remove("show"); renderAdvice(); }

function populateMonths() {
  const a = document.getElementById("monthSelect");
  const b = document.getElementById("amountMonth");
  a.innerHTML = ""; b.innerHTML = "";
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const v = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const l = `${d.getFullYear()}年${d.getMonth()+1}月`;
    a.innerHTML += `<option value="${v}">${l}</option>`;
    b.innerHTML += `<option value="${v}">${l}</option>`;
  }
  a.value = rebate.currentMonth;
}
function changeMonth() { rebate.currentMonth = document.getElementById("monthSelect").value; saveAll(); renderRebate(); }
function spent(cardId, month) {
  return rebate.transactions.filter(t => t.cardId === cardId && t.month === month).reduce((s,t) => s + Number(t.amount), 0);
}
function renderRebate() {
  const cards = activeCards();
  const grid = document.getElementById("cardsGrid");
  grid.innerHTML = cards.length ? cards.slice(0,6).map(card => {
    const cap = Number((rebate.settings[card.id] || {}).cap || 0);
    const remain = Math.max(0, cap - spent(card.id, rebate.currentMonth));
    const cls = cap && remain <= 0 ? "zero" : (cap && remain < cap * 0.2 ? "low" : "");
    return `<div class="card-item" onclick="openAmountModal('${card.id}')"><div>
      <div class="card-nickname">${escapeHtml(card.nickname)}</div>
      <div class="card-network">${escapeHtml(card.network || "")}</div></div>
      <div class="card-remaining ${cls}">剩餘上限 $${remain.toLocaleString()}</div></div>`;
  }).join("") : `<div class="empty" style="grid-column:span 2">未有信用卡</div>`;

  const recent = [...rebate.transactions].sort((a,b)=>b.timestamp-a.timestamp).slice(0,3);
  document.getElementById("recentRecords").innerHTML = recent.length ? recent.map(t => {
    const c = cardById(t.cardId);
    const time = new Date(t.timestamp).toLocaleString("zh-HK",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
    return `<div class="row"><div><b>$${Number(t.amount).toLocaleString()}</b><div class="muted">${escapeHtml(c?c.nickname:"未知")}</div></div><div class="muted">${time}</div></div>`;
  }).join("") : `<div class="empty">未有簽帳紀錄</div>`;

  document.getElementById("summaryCard").innerHTML = cards.length ? cards.map(card => {
    const st = rebate.settings[card.id] || {cap:0,rate:0};
    const s = spent(card.id, rebate.currentMonth);
    const remain = Math.max(0,(st.cap||0)-s);
    const est = Math.min(s, st.cap || s) * ((st.rate||0)/100);
    return `<div class="row"><div class="muted">${escapeHtml(card.nickname)}${st.cap && s>=st.cap ? " · 已達上限":""}</div>
      <div>已簽 $${s.toLocaleString()} · 剩 $${remain.toLocaleString()} · 預估 $${est.toFixed(1)}</div></div>`;
  }).join("") : `<div class="empty">暫無資料</div>`;
}
function openAmountModal(id) {
  currentCardId = id;
  document.getElementById("amountModalTitle").textContent = "新增簽帳 · " + cardById(id).nickname;
  document.getElementById("amountMonth").value = rebate.currentMonth;
  document.getElementById("amountInput").value = "";
  document.getElementById("amountModal").classList.add("show");
}
function closeAmountModal() { document.getElementById("amountModal").classList.remove("show"); }
function saveAmount() {
  const amount = Number(document.getElementById("amountInput").value);
  if (!amount || amount <= 0) { alert("請輸入有效金額"); return; }
  rebate.transactions.push({ id: Date.now().toString(), cardId: currentCardId, amount, month: document.getElementById("amountMonth").value, timestamp: Date.now() });
  saveAll(); closeAmountModal(); renderRebate(); toast("已記錄");
}

function renderVault() {
  const kw = (document.getElementById("searchInput").value || "").toLowerCase();
  let cards = vault.cards.filter(c => showDeleted ? c.deleted : !c.deleted);
  if (kw) cards = cards.filter(c => (c.nickname||"").toLowerCase().includes(kw) || (c.last4||"").includes(kw) || (c.bank||"").toLowerCase().includes(kw));
  const banks = {};
  cards.forEach(c => { const b = c.bank || "其他"; (banks[b]=banks[b]||[]).push(c); });
  const box = document.getElementById("vaultList");
  if (!Object.keys(banks).length) { box.innerHTML = `<div class="empty">${showDeleted?"沒有已刪除卡片":"尚未新增信用卡"}</div>`; return; }
  box.innerHTML = Object.keys(banks).map(bank => `<div class="block"><div class="muted" style="margin-bottom:8px">${escapeHtml(bank)} · ${banks[bank].length} 張</div>${
    banks[bank].map(card => `<div class="vault-card" onclick="showDetail('${card.id}')">
      <div><b>${escapeHtml(card.nickname)}</b><div class="muted">${escapeHtml(card.network||"")} · **** ${escapeHtml(card.last4||"")}${card.nextEligibleDate && card.deleted ? " · 下次迎新 "+card.nextEligibleDate : ""}</div></div>
      ${card.deleted ? '<span class="deleted-tag">已刪除</span>' : ""}
    </div>`).join("")
  }</div>`).join("");
}
function toggleDeletedView() {
  showDeleted = !showDeleted;
  document.getElementById("deletedBtnText").textContent = showDeleted ? "返回有效卡片" : "查看已刪除卡片";
  renderVault();
}
function showDetail(id) {
  const card = cardById(id); if (!card) return;
  const st = rebate.settings[id] || {cap:0,rate:0};
  document.getElementById("detailTitle").textContent = card.nickname;
  document.getElementById("detailContent").innerHTML = `
    <div class="row"><span class="muted">銀行</span><span>${escapeHtml(card.bank||"-")}</span></div>
    <div class="row"><span class="muted">網絡</span><span>${escapeHtml(card.network||"-")}</span></div>
    <div class="row"><span class="muted">最後4位</span><span>${escapeHtml(card.last4||"-")} <button class="back" onclick="copyText('${card.last4||""}')">複製</button></span></div>
    ${card.fullNumber ? `<div class="row"><span class="muted">完整卡號</span><span>${escapeHtml(card.fullNumber)} <button class="back" onclick="copyText('${card.fullNumber}')">複製</button></span></div>` : ""}
    ${card.expiry ? `<div class="row"><span class="muted">到期日</span><span>${escapeHtml(card.expiry)} <button class="back" onclick="copyText('${card.expiry}')">複製</button></span></div>` : ""}
    ${card.cvc ? `<div class="row"><span class="muted">CVC</span><span>••• <button class="back" onclick="copyText('${card.cvc}')">複製</button></span></div>` : ""}
    <div class="row"><span class="muted">回贈上限</span><span>$${(st.cap||0).toLocaleString()}</span></div>
    <div class="row"><span class="muted">回贈比率</span><span>${st.rate||0}%</span></div>
    ${card.deleted ? `<div class="row"><span class="muted">下次迎新</span><span>${card.nextEligibleDate||"-"}</span></div>` : `<div style="margin-top:14px"><button class="btn btn-danger" style="width:100%" onclick="openDeleteModal('${id}')">刪除並設定迎新冷卻</button></div>`}
  `;
  showPage("detail");
}
function copyText(t) {
  if (!t) return;
  navigator.clipboard.writeText(t).then(()=>toast("已複製")).catch(()=>{
    const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); toast("已複製");
  });
}

function openAddCard() {
  addCurrentStep = 1; selectedCats = [];
  ["newNickname","newBank","newLast4","newFullNumber","newExpiry","newCvc","newCap","newRate"].forEach(id => document.getElementById(id).value = "");
  renderChips(); updateAddStep();
  document.getElementById("addCardModal").classList.add("show");
}
function renderChips() {
  document.getElementById("catChips").innerHTML = advice.slots.map(s =>
    `<button type="button" class="chip ${selectedCats.includes(s.name)?"on":""}" onclick="toggleCat('${s.name}')">${s.name}</button>`
  ).join("");
}
function toggleCat(name) {
  selectedCats = selectedCats.includes(name) ? selectedCats.filter(x => x !== name) : selectedCats.concat(name);
  renderChips();
}
function updateAddStep() {
  document.getElementById("step1").classList.toggle("hidden", addCurrentStep !== 1);
  document.getElementById("step2").classList.toggle("hidden", addCurrentStep !== 2);
  document.getElementById("step3").classList.toggle("hidden", addCurrentStep !== 3);
  document.getElementById("addStepHint").textContent = ["第 1／3 步：金庫資料","第 2／3 步：回贈設定","第 3／3 步：簽帳建議"][addCurrentStep-1];
  document.getElementById("addPrevBtn").textContent = addCurrentStep === 1 ? "取消" : "上一步";
  document.getElementById("addNextBtn").textContent = addCurrentStep === 3 ? "完成" : "下一步";
}
function addStep(d) {
  if (d < 0 && addCurrentStep === 1) { document.getElementById("addCardModal").classList.remove("show"); return; }
  if (d > 0 && addCurrentStep === 1 && !document.getElementById("newNickname").value.trim()) { alert("請輸入暱稱"); return; }
  if (d > 0 && addCurrentStep === 3) { saveNewCard(); return; }
  addCurrentStep += d; updateAddStep();
}
function saveNewCard() {
  const id = Date.now().toString();
  vault.cards.push({
    id,
    nickname: document.getElementById("newNickname").value.trim(),
    bank: document.getElementById("newBank").value.trim() || "其他",
    network: document.getElementById("newNetwork").value,
    last4: document.getElementById("newLast4").value.trim(),
    fullNumber: document.getElementById("newFullNumber").value.trim(),
    expiry: document.getElementById("newExpiry").value.trim(),
    cvc: document.getElementById("newCvc").value.trim(),
    deleted: false, createdAt: Date.now()
  });
  rebate.settings[id] = { cap: Number(document.getElementById("newCap").value)||0, rate: Number(document.getElementById("newRate").value)||0 };
  advice.slots.forEach(s => { if (selectedCats.includes(s.name)) s.cardId = id; });
  saveAll();
  document.getElementById("addCardModal").classList.remove("show");
  showPage("vault"); toast("已存入金庫");
}

function openDeleteModal(id) {
  currentCardId = id;
  document.getElementById("deleteDate").value = new Date().toISOString().slice(0,10);
  document.getElementById("cooldownMonths").value = "12";
  calcNext();
  document.getElementById("deleteDate").onchange = calcNext;
  document.getElementById("cooldownMonths").onchange = calcNext;
  document.getElementById("deleteModal").classList.add("show");
}
function closeDeleteModal() { document.getElementById("deleteModal").classList.remove("show"); }
function calcNext() {
  const d = new Date(document.getElementById("deleteDate").value);
  d.setMonth(d.getMonth() + Number(document.getElementById("cooldownMonths").value));
  document.getElementById("nextEligibleDate").value = d.toISOString().slice(0,10);
}
function confirmDelete() {
  const card = cardById(currentCardId); if (!card) return;
  card.deleted = true;
  card.deletedDate = document.getElementById("deleteDate").value;
  card.cooldownMonths = Number(document.getElementById("cooldownMonths").value);
  card.nextEligibleDate = document.getElementById("nextEligibleDate").value;
  advice.slots.forEach(s => { if (s.cardId === card.id) s.cardId = ""; });
  saveAll(); closeDeleteModal(); showPage("vault"); toast("已刪除");
}

function exportAll() {
  const obj = { type:"card-app-all", version:4, exportedAt:new Date().toISOString(), vault, rebate, advice };
  const blob = new Blob([JSON.stringify(obj,null,2)], {type:"application/json"});
  const name = `卡_${new Date().toISOString().slice(0,10)}.json`;
  if (navigator.share && navigator.canShare) {
    const f = new File([blob], name, {type:"application/json"});
    if (navigator.canShare({files:[f]})) { navigator.share({files:[f], title:name}).then(()=>toast("已匯出")).catch(()=>dl(blob,name)); return; }
  }
  dl(blob,name);
}
function dl(blob,name) {
  const url = URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); toast("已匯出");
}
function importData(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const obj = JSON.parse(e.target.result);
      if (!confirm("匯入會覆蓋本機資料，確定？")) return;
      if (obj.type === "card-app-all" || (obj.vault && obj.rebate)) {
        vault = obj.vault || vault; rebate = obj.rebate || rebate; advice = obj.advice || advice;
      } else if (obj.cards) { vault.cards = obj.cards; rebate.transactions = obj.transactions || rebate.transactions; }
      else { alert("無法識別檔案"); return; }
      ensureSlots(); saveAll(); renderAdvice(); renderVault(); renderRebate(); toast("已匯入");
    } catch(err) { alert("讀取失敗"); }
  };
  r.readAsText(file); ev.target.value = "";
}

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
init();
</script>
</body>
